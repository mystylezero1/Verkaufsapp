<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resell-Assistant Pro v8.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold"><i class="fas fa-tags mr-2"></i>Resell-Assistant Pro</h1>
        <button id="btn-settings" class="bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded-lg transition"><i class="fas fa-cog mr-2"></i>API-Keys</button>
    </nav>

    <main class="container mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Linke Spalte: Upload & Basis-Daten -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">1. Produktdaten & KI</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">KI-Provider wählen</label>
                <select id="ai-provider" class="w-full p-2 border rounded-lg bg-gray-50">
                    <option value="gemini-2.0-flash">Google Gemini 2.0 Flash</option>
                    <option value="gpt-4o">OpenAI GPT-4o</option>
                    <option value="claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Fotos hochladen (Collage wird generiert)</label>
                <!-- Der Klickbereich für den Upload -->
                <div id="upload-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:bg-gray-50 transition">
                    <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                    <p class="text-gray-500">Klicken oder Bilder hierher ziehen</p>
                    <input type="file" id="image-upload" multiple class="hidden" accept="image/*">
                </div>
                <!-- Container für die kleinen Vorschaubilder -->
                <div id="image-preview" class="flex gap-2 mt-2 overflow-x-auto"></div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium mb-1">Zustand</label>
                    <select id="condition" class="w-full p-2 border rounded-lg bg-gray-50">
                        <option value="neu">Neu / OVP</option>
                        <option value="gebraucht">Gebraucht</option>
                        <option value="unbekannt">Unbekannt / Defekt?</option>
                    </select>
